# Builds the FeetF1rst Print Windows installer (.exe).
# Every push: download it from the run page under "Artifacts".
# A tag like v1.0.1: the installer is also attached to a GitHub Release.
name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # silent PDF printing engine, shipped inside the installer
      - name: Download SumatraPDF
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Get-ChildItem sumatra -Filter *.exe | Select-Object -First 1 | Copy-Item -Destination src-tauri/bin/SumatraPDF.exe

      - run: npm ci
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: FeetF1rst-Print-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
