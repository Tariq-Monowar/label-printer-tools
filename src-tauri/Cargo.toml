[package]
name = "feetf1rst-print"
version = "1.0.0"
description = "Prints FeetF1rst shipping labels straight to the label printer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "2"

# small and fast binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
